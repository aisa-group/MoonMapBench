[project]
name = "moonmapbench"
version = "0.1.0"
description = "How does a blind model see the Moon? Query an LLM for lunar elevation on a lat/lon grid and compare to LOLA."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openai>=3.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
